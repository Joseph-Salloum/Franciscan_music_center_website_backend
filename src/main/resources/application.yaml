spring:
  application:
    name: backend
  config:
    import: optional:classpath:application-local.yaml

  sql:
    init:
      mode: always

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 1800000
    dev-expiration-ms: 3600000

logging:
  level:
    root: INFO
    music_center_backend: INFO